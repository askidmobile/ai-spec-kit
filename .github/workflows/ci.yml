name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tasks.py tests
        run: python3 skills/task-tracker/scripts/test_tasks.py
      - name: shell syntax
        run: bash -n install.sh uninstall.sh
      - name: server.js syntax
        run: node --check skills/wiki-compiler/visualize/server.js
